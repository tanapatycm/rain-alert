name: Yala RainWatch cloud radar
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  id-token: write
concurrency:
  group: rainwatch-radar
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAINWATCH_SITE: https://yala-rainwatch.workspace-751322.chatgpt.site
      RAINWATCH_WORK: /tmp/rainwatch-work
      RAINWATCH_SITE_ACCESS: ${{ secrets.RAINWATCH_SITE_ACCESS }}
    steps:
      - name: Install OCR tools on the cloud runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Fetch verified radar runner
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request
          origin = 'https://yala-rainwatch.workspace-751322.chatgpt.site'
          access = os.environ.get('RAINWATCH_SITE_ACCESS', '')
          if not access:
              raise SystemExit('Missing RAINWATCH_SITE_ACCESS repository secret. Configure the Site service access credential first.')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise SystemExit('Unexpected Site redirect; service credential was not forwarded.')
          opener = urllib.request.build_opener(NoRedirect())
          assets = {'radar-cycle.py': 'ca2f726a1391e9c583be50a6c315cafbf4953bf621715b89285125f06716349a', 'service.py': 'c9cfedf1a246a54271e17ac4327a794f87da77faf26169b0979174352df42f36', 'rainviewer_acquire.py': 'b6f24bbcce9be1a9f23c2a3bd8f8856a8386e9d69fecd46c9d8b40f2fe9f9a13', 'rainviewer-palette.json': '443a7f86d8e5ffdb4ca50c1dc80088d43e119d59186707eb7b1f0cdbfb648111'}
          for name, expected in assets.items():
              request = urllib.request.Request(origin+'/runner/'+name, headers={'OAI-Sites-Authorization': 'Bearer '+access})
              with opener.open(request, timeout=30) as response:
                  data = response.read(1000001)
              if hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit('Runner changed. Update rainwatch.yml from the Site before running again.')
              pathlib.Path(name).write_bytes(data)
          PY
      - name: Check real radar and submit eligible alerts
        run: .venv/bin/python service.py --once
